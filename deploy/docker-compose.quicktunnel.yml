# Zero-config public URLs through Cloudflare, with no account, domain or token.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml -f docker-compose.quicktunnel.yml up -d
#
# Each service gets its own random https://<slug>.trycloudflare.com hostname, printed in the
# container log at startup. The URL is NEW every time the container restarts, so this is for
# demoing from any network, not for a build you hand out. Use docker-compose.tunnel.yml (named
# tunnel + your own domain) once you have a zone on Cloudflare.
#
# --protocol http2 is required: on the default QUIC transport cloudflared can drop the
# `Upgrade: websocket` header, which breaks /chat/ws and /voice with browser code 1006.

services:
  caddy:
    deploy:
      replicas: 0

  tunnel-api:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://core:4000"]
    depends_on:
      - core
    restart: unless-stopped

  tunnel-voice:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://voice:4001"]
    depends_on:
      - voice
    restart: unless-stopped
