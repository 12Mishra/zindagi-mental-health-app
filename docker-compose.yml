services:
  # Express Auth Server (port 4000)
  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_OTP_CODE=${AUTH_OTP_CODE:-1234}
      - AUTH_OTP_TTL_MINUTES=${AUTH_OTP_TTL_MINUTES:-10}
      - AUTH_SESSION_TTL_DAYS=${AUTH_SESSION_TTL_DAYS:-30}
      - PORT=4000
    restart: unless-stopped

  # Go Voice Server (port 4001)
  voice-server:
    build:
      context: ./server/go-voice
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=4001
    volumes:
      - voice-audio:/app/uploads/audio
    restart: unless-stopped

volumes:
  voice-audio:
